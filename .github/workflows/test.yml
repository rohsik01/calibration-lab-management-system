name: Python test suite

on:
  pull_request:
    paths:
      - "**.py"
      - "templates/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  push:
    branches:
      - main
      - global-search-toolbox-traceability
      - quality-management-nonconformance-capa

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r dev-requirements.txt
      - name: Run tests
        run: python -m pytest -q
