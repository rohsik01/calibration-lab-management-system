{% extends "base.html" %}
{% block title %}{{ tr("Nonconforming work") }}{% endblock %}
{% block content %}
<div class="hero"><div><h1>⚠️ {{ tr("Nonconforming work & CAPA") }}</h1><p class="sub">Controlled quality events and corrective actions.</p></div><a class="btn" href="{{ url_for('new_nonconformity') }}">+ {{ tr("Report nonconformity") }}</a></div>
<form class="toolbar" method="get"><input name="q" value="{{ q }}" placeholder="Search NC, title, certificate…"><select name="status"><option value="">All statuses</option>{% for s in statuses %}<option value="{{ s }}" {{ 'selected' if status==s }}>{{ s }}</option>{% endfor %}</select><select name="severity"><option value="">All severity</option>{% for s in ('LOW','MEDIUM','MAJOR','CRITICAL') %}<option value="{{ s }}" {{ 'selected' if severity==s }}>{{ s }}</option>{% endfor %}<button class="btn" type="submit">Filter</button></form>
<div class="card"><div class="scroll"><table><tr><th>NC</th><th>Severity</th><th>Title</th><th>Status</th><th>Detected</th><th>Impacts</th><th>Open actions</th></tr>{% for x in rows %}<tr><td><a href="{{ url_for('quality_nonconformity',nc_id=x.nc_id) }}">{{ x.nc_no }}</a></td><td><span class="badge {{ 'red' if x.severity in ('CRITICAL','MAJOR') else 'amber' if x.severity=='MEDIUM' else 'grey' }}">{{ x.severity }}</span></td><td>{{ x.title }}</td><td>{{ x.status }}</td><td>{{ date_pair(x.detected_at) }}</td><td>{{ x.impact_count }}</td><td>{{ x.open_actions }}</td></tr>{% else %}<tr><td colspan="7" class="empty">No quality events found.</td></tr>{% endfor %}</table></div></div>
{% endblock %}
